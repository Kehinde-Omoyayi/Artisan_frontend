{% load static %}<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ headline }} · Artisan Market</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      padding: 28px 18px; background: #f7f0e8; color: #3d2a1d;
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    }
    .card {
      width: 100%; max-width: 460px; background: #fffdfa; border-radius: 18px;
      border: 1px solid rgba(116, 67, 47, .14); padding: 30px 28px 26px;
      box-shadow: 0 18px 44px rgba(88, 52, 30, .12);
    }
    .brand { font-size: 13px; letter-spacing: .12em; text-transform: uppercase; color: #9a7a62; font-weight: 700; }
    h1 { margin: 10px 0 10px; font-size: 22px; line-height: 1.3; color: #5d3b23; }
    p { margin: 0 0 20px; font-size: 14.5px; line-height: 1.65; color: #6d5341; }
    .actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
    .button {
      display: inline-block; border: 0; border-radius: 10px; padding: 11px 18px;
      font-size: 14px; font-weight: 650; cursor: pointer; text-decoration: none;
      background: #a9522b; color: #fff; font-family: inherit;
    }
    .button:hover { background: #92441f; }
    .button-secondary { background: #f1e3d6; color: #6b432b; }
    .button-secondary:hover { background: #e8d5c4; }
  </style>
</head>
<body>
  <main class="card">
    <span class="brand">Artisan Market</span>
    <h1>{{ headline }}</h1>
    <p>{{ detail }}</p>
    <div class="actions">
      {% if action == "logout" %}
        <form method="post" action="{{ logout_url }}">
          <input type="hidden" name="csrfmiddlewaretoken" value="{{ csrf_token_value }}">
          <button class="button" type="submit">Sign out now</button>
        </form>
        <a class="button button-secondary" href="{{ home_url }}">Stay signed in</a>
      {% elif action == "login" %}
        <a class="button" href="{{ login_url }}">Sign in again</a>
        <a class="button button-secondary" href="{{ home_url }}">Go to the home page</a>
      {% else %}
        <a class="button" href="{{ home_url }}">Back to the home page</a>
      {% endif %}
    </div>
  </main>
</body>
</html>
